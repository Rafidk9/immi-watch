name: status page

# Rebuilds the GitHub Pages status page after every check. The cloud check pushes with
# GITHUB_TOKEN, which never triggers `push` workflows, hence `workflow_run`; the office-PC
# runner pushes as the user, which does.
on:
  workflow_run:
    workflows: [immi-watch]
    types: [completed]
  push:
    branches: [main]
    paths: [state-local.json, sources.yaml, status_page.py]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build page
        run: |
          pip install -q pyyaml
          python status_page.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
