# Pages watched by immi-watch.
#
# Fields
#   id        unique slug (used for the snapshot file name)
#   name      human label shown in alerts
#   group     section heading in alerts
#   url       page to watch
#   method    http        plain request + HTML text extraction (default)
#             homeaffairs Home Affairs SharePoint page (content lives in hidden JSON fields)
#             ha_news     Home Affairs news JSON API (lists new/edited news items)
#             legislation newly registered Acts/instruments from the Federal Register API
#             rss         RSS/Atom feed (optional `keywords` regex filter); alerts on new items
#             browser     headless Chromium (needed for Cloudflare-protected sites)
#   selector  optional CSS selector for the main content (falls back to <main>, then <body>)
#   priority  high | normal   (high = alert even on small edits)
#   every     optional: check every N hours instead of every hour

defaults:
  method: http
  priority: normal

