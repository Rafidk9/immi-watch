  # ---------------- Legislation ----------------
  - id: leg-new-legislation
    name: Federal Register – newly registered migration / student / citizenship legislation
    group: Legislation
    url: https://www.legislation.gov.au/
    method: legislation
    # Title words. "Overseas Student" covers both the ESOS Act instruments and the National Code.
    terms: ["Migration", "Visa", "Visas", "Australian Citizenship", "Overseas Student", "Overseas Students",
            "International Student", "International Students", "Education Services for Overseas Students",
            "Higher Education Standards", "Tertiary Education Quality and Standards Agency",
            "National Vocational Education and Training Regulator"]
    days: 120
    priority: high
  - id: parl-bills
    name: Parliament – bills introduced (migration, education, citizenship, visas)
    group: Legislation
    url: "https://parlinfo.aph.gov.au/parlInfo/feeds/rss.w3p;adv=yes;orderBy=date-eFirst;page=0;query=Dataset%3Abillhome%20Date%3AthisYear;resCount=200"
    method: rss
    keywords: "migration|visa|citizenship|overseas student|international student|education|tertiary|vocational|universit"
    priority: high
    fallback: browser   # blocks plain requests from cloud servers
    timeout: 10
  - id: leg-migration-regs
    name: Migration Regulations 1994 – versions / amendments
    group: Legislation
    url: https://www.legislation.gov.au/F1996B03551/latest/versions
    priority: high

